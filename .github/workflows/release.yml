name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode (validate all release gates without publishing to PyPI)"
        required: true
        type: boolean
        default: true
      publish_testpypi:
        description: "Publish to TestPyPI after successful validation"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate 1: Comprehensive Validation Suite
  validate-gates:
    name: "[Gate 1] Pre-Release Quality & Regression Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine psutil

      - name: Execute Full Release Gate Checker
        run: |
          python scripts/release_check.py

      - name: Run Real-World Demo 17-Step Autonomous Workflow
        run: |
          python scripts/run_full_workflow.py

      - name: Run Performance Smoke Validation
        run: |
          python benchmarks/run_benchmarks.py --smoke

  # Gate 2: Package Distribution Build & Checksums
  build-artifacts:
    name: "[Gate 2] Build Release Packages & Checksums"
    runs-on: ubuntu-latest
    needs: [validate-gates]
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pkg_info.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Distribution Packages
        run: |
          python -m build

      - name: Validate Package Metadata with Twine
        run: |
          twine check dist/aireliability-*.whl dist/aireliability-*.tar.gz

      - name: Generate Cryptographic SHA256 Checksums
        id: pkg_info
        run: |
          cd dist
          sha256sum aireliability-* > SHA256SUMS
          cat SHA256SUMS
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('../pyproject.toml', 'rb'))['project']['version'])")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ steps.pkg_info.outputs.version }}
          path: dist/
          retention-days: 30

  # Gate 3: Clean Wheel Isolation Test
  clean-wheel-test:
    name: "[Gate 3] Clean Wheel Isolated Installation"
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Download Release Packages
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.build-artifacts.outputs.version }}
          path: dist/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Wheel in Isolated Environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Verify Isolated Import and CLI
        run: |
          cd /tmp
          python -c "import aireliability; print('Imported version:', aireliability.__version__)"
          airel --version
          airel --help

  # Gate 4: GitHub Release Creation
  create-github-release:
    name: "[Gate 4] Publish GitHub Release & Assets"
    runs-on: ubuntu-latest
    needs: [build-artifacts, clean-wheel-test]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.build-artifacts.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "aireliability v${{ needs.build-artifacts.outputs.version }}"
          body_path: docs/release/${{ needs.build-artifacts.outputs.version }}.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: false

  # Gate 5: TestPyPI Publication (Optional / Protected Environment)
  publish-testpypi:
    name: "[Gate 5] Publish to TestPyPI"
    runs-on: ubuntu-latest
    needs: [build-artifacts, clean-wheel-test]
    if: github.event.inputs.publish_testpypi == 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aireliability
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download Release Packages
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.build-artifacts.outputs.version }}
          path: dist/

      - name: Prepare TestPyPI Distribution Packages
        run: |
          mkdir -p publish-test
          cp dist/*.whl publish-test/
          cp dist/*.tar.gz publish-test/

      - name: Publish to TestPyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: publish-test/
          skip-existing: true

      - name: Verify TestPyPI Installation
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ aireliability==${{ needs.build-artifacts.outputs.version }}
          cd /tmp
          python -c "import aireliability; print('TestPyPI installation verified:', aireliability.__version__)"
          airel --version

  # Gate 6: Production PyPI Publishing (Strictly Gated, Requires Manual Environment Approval)
  publish-pypi:
    name: "[Gate 6] Publish to Production PyPI"
    runs-on: ubuntu-latest
    needs: [validate-gates, build-artifacts, clean-wheel-test]
    # Production PyPI publication is strictly protected:
    # 1. Must be a published git tag push: refs/tags/v*.*.*
    # 2. Must NOT be dry_run
    # 3. Requires GitHub environment 'pypi' approval
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/aireliability
    permissions:
      id-token: write  # OIDC trusted publishing - zero stored credentials
    steps:
      - name: Download Release Packages
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.build-artifacts.outputs.version }}
          path: dist/

      - name: Prepare and Validate Production PyPI Distribution Packages
        run: |
          mkdir -p publish
          cp dist/*.whl publish/
          cp dist/*.tar.gz publish/

          # Strict validation: ensure publish/ contains exclusively .whl and .tar.gz distributions
          for file in publish/*; do
            case "$file" in
              *.whl|*.tar.gz) ;;
              *)
                echo "ERROR: Disallowed non-package file detected in publish/: $file" >&2
                exit 1
                ;;
            esac
          done

          # Verify that SHA256SUMS or other non-package files are strictly absent
          if [ -f publish/SHA256SUMS ] || [ $(ls -1 publish/*.txt publish/*.md publish/*.json publish/*.zip 2>/dev/null | wc -l) -gt 0 ]; then
            echo "ERROR: Disallowed non-distribution artifacts present in publish/" >&2
            exit 1
          fi

          # Ensure exactly one wheel and one sdist exist
          WHL_COUNT=$(ls -1 publish/*.whl 2>/dev/null | wc -l)
          SDIST_COUNT=$(ls -1 publish/*.tar.gz 2>/dev/null | wc -l)
          if [ "$WHL_COUNT" -ne 1 ] || [ "$SDIST_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 wheel and 1 sdist, found $WHL_COUNT wheels and $SDIST_COUNT sdists" >&2
            exit 1
          fi

          echo "Verified publish/ contents:"
          ls -la publish/

      - name: Publish to Production PyPI via Trusted Publishing OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
          verify-metadata: true
