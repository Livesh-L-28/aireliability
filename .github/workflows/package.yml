name: Package

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      wheel_name: ${{ steps.build.outputs.wheel_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Source Distribution & Wheel
        id: build
        run: |
          python -m build
          WHEEL=$(basename dist/*.whl)
          echo "wheel_name=${WHEEL}" >> $GITHUB_OUTPUT

      - name: Twine Check Metadata
        run: twine check dist/*.whl dist/*.tar.gz

      - name: Generate Cryptographic SHA256 Checksums
        run: |
          cd dist
          sha256sum aireliability-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Built Distribution Packages
        uses: actions/upload-artifact@v4
        with:
          name: distribution-packages
          path: dist/
          retention-days: 14

  clean-install-matrix:
    name: Clean Install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Download Built Packages
        uses: actions/download-artifact@v4
        with:
          name: distribution-packages
          path: dist/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Wheel in Clean Isolated Environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Verify Isolated Package Import and CLI
        run: |
          # Run outside any project directory to prevent local import pollution
          cd /tmp
          python -c "import aireliability; print('Successfully imported aireliability version:', aireliability.__version__)"
          airel --version
          airel --help
