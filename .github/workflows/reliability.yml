name: Reliability

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reliability:
    name: Deterministic Reliability & Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Deterministic Reliability Benchmarks & Scenarios
        run: |
          pytest tests/unit/test_phase14_benchmarks.py \
                 tests/unit/test_phase18_regression.py \
                 tests/unit/test_phase20_ci_reliability.py \
                 tests/unit/test_phase23_distributed.py \
                 tests/unit/test_phase24_persistence.py \
                 tests/unit/test_phase25_control_plane.py \
                 tests/unit/test_phase26_resilience.py \
                 -v

      - name: Run Smoke Benchmark (100 Iterations)
        run: |
          python benchmarks/run_benchmarks.py --smoke

      - name: Verify CLI PR Reliability Reporting & Step Summary
        run: |
          # 1. Initialize clean test project
          mkdir -p /tmp/pr-reliability-eval
          airel init --dir /tmp/pr-reliability-eval
          
          # 2. Establish main baseline with nominal agent
          airel test --dir /tmp/pr-reliability-eval --save-baseline
          
          # 3. Evaluate PR with comparison and generate reports
          airel compare default \
            --dir /tmp/pr-reliability-eval \
            --report-json /tmp/reliability-report.json \
            --report-markdown /tmp/reliability-report.md

          # 4. Append to GitHub Step Summary if running in GitHub Actions
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat /tmp/reliability-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Reliability Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-reports
          path: |
            /tmp/reliability-report.json
            /tmp/reliability-report.md
            benchmarks/phase14_results.json
          retention-days: 14
