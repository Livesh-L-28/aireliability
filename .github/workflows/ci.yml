name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Ruff Lint Check
        run: ruff check .

      - name: Ruff Formatting Check
        run: ruff format --check .

  version:
    name: Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Version Consistency Across Repository
        run: python scripts/check_version.py

  tests:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, version]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Core Test Suite (Unit, Integration, Security)
        run: |
          pytest tests \
            --junitxml=junit-core-${{ matrix.python-version }}.xml \
            -v

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: junit-core-${{ matrix.python-version }}.xml
          retention-days: 7

  demo:
    name: Real-World Demo Verification
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Demo Test Suite (27 tests)
        run: |
          pytest examples/aireliability_demo/tests \
            --junitxml=junit-demo.xml \
            -v

      - name: Execute Full 17-Step Autonomous Enterprise Demo
        run: |
          python scripts/run_full_workflow.py

      - name: Upload Demo Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-test-results
          path: junit-demo.xml
          retention-days: 7

  smoke-benchmark:
    name: Performance Smoke Validation
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install psutil

      - name: Run Smoke Benchmarks
        run: |
          python benchmarks/run_benchmarks.py --smoke

      - name: Upload Smoke Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-benchmark-artifacts
          path: benchmarks/results/
          retention-days: 7

  package-check:
    name: Packaging & Clean Isolated Install
    runs-on: ubuntu-latest
    needs: [tests, demo, smoke-benchmark]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Packaging Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Source Distribution & Wheel
        run: python -m build

      - name: Validate Metadata with Twine
        run: twine check dist/*.whl dist/*.tar.gz

      - name: Clean Virtual Environment Installation Test
        run: |
          # Create isolated temporary virtual environment outside repository tree
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install --upgrade pip
          /tmp/clean-venv/bin/pip install dist/*.whl

          # Verify import and CLI outside repo tree
          cd /tmp
          /tmp/clean-venv/bin/python -c "import aireliability; print('Imported version:', aireliability.__version__)"
          /tmp/clean-venv/bin/airel --version
          /tmp/clean-venv/bin/airel --help
