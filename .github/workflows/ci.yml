name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite with JUnit report
        run: |
          pytest --junitxml=junit-results-${{ matrix.python-version }}.xml

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: junit-results-${{ matrix.python-version }}.xml
          retention-days: 7

  package:
    name: Package Build & Clean Install Verification
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package distribution (sdist and wheel)
        run: python -m build

      - name: Validate distribution metadata with Twine
        run: |
          ls -la dist/
          twine check dist/*

      - name: Clean environment installation test
        run: |
          # Create an isolated temporary virtual environment outside repository tree
          python -m venv /tmp/aireliability-clean
          /tmp/aireliability-clean/bin/pip install --upgrade pip
          /tmp/aireliability-clean/bin/pip install dist/*.whl
          
          # Verify Python import and CLI entrypoint
          /tmp/aireliability-clean/bin/python -c "import aireliability; print('aireliability version:', aireliability.__version__)"
          /tmp/aireliability-clean/bin/airel --help
