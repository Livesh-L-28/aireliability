name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      - name: Accidental Secret Scanner
        run: |
          python -c "
          import os, re, sys
          patterns = [
              re.compile(r'(?i)(api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key)\s*[:=]\s*[\'\"][^\'\"]+[\'\"]'),
              re.compile(r'-----BEGIN (?:RSA |EC )?PRIVATE KEY-----'),
              re.compile(r'ghp_[a-zA-Z0-9]{36}'),
              re.compile(r'sk-[a-zA-Z0-9]{32,}'),
          ]
          leaks = []
          for root, _, files in os.walk('.'):
              if any(p in root for p in ['.git', '__pycache__', '.pytest_cache', 'dist', 'egg-info', '.ruff_cache', 'artifacts']):
                  continue
              for f in files:
                  if f.endswith(('.py', '.json', '.md', '.yml', '.yaml', '.toml')):
                      path = os.path.join(root, f)
                      try:
                          with open(path, 'r', encoding='utf-8', errors='ignore') as fh:
                              for line_no, line in enumerate(fh, 1):
                                  for pat in patterns:
                                      if pat.search(line):
                                          if any(d in line.lower() for d in ['dummy', 'mock', 'synthetic', 'test', 'fake', 'example', 'env', 'os.getenv', 'secret_key = none', 'secret_key: str', 'api_key: str', 'str =']):
                                              continue
                                          leaks.append(f'{path}:{line_no}')
                      except Exception:
                          pass
          if leaks:
              print('[!] Potential real secrets detected:', leaks)
              sys.exit(1)
          print('[+] No real secrets or sensitive credentials detected.')
          "

      - name: Run Dedicated Security Test Suite
        run: |
          pytest tests/security/ \
            --junitxml=junit-security.xml \
            -v

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit --desc || true

      - name: Upload Security Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: junit-security.xml
          retention-days: 7
