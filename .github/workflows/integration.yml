name: Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  framework-matrix:
    name: Optional Frameworks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with optional framework dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langgraph,langchain,openai,opentelemetry,prometheus]"

      - name: Run framework and provider integration test suite
        run: |
          pytest tests/unit/test_phase19_integrations.py tests/unit/test_phase21_provider_integration.py tests/unit/test_phase22_telemetry.py -v
