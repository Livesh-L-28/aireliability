[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aireliability"
version = "0.1.0"
description = "An open-source reliability and regression-testing framework for LLM applications and AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "AI Reliability Engine Contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
airel = "aireliability.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
langgraph = [
    "langgraph>=0.0.1",
    "langchain-core>=0.1.0",
]
langchain = [
    "langchain-core>=0.1.0",
    "langchain>=0.1.0",
]
openai = [
    "openai>=1.0.0",
]
opentelemetry = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
prometheus = [
    "prometheus-client>=0.17.0",
]
postgres = [
    "psycopg>=3.1.0",
]
redis = [
    "redis>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/aireliability/aireliability"
Repository = "https://github.com/aireliability/aireliability.git"
Issues = "https://github.com/aireliability/aireliability/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aireliability"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"

markers = [
    "langgraph: marks tests that require the optional langgraph dependency",
    "langchain: marks tests that require the optional langchain dependency",
    "openai: marks tests that require the optional openai dependency",
    "opentelemetry: marks tests that require the optional opentelemetry dependency",
    "prometheus: marks tests that require the optional prometheus dependency",
]

filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["aireliability"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
